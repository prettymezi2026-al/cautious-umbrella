<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>집현전 맞춤법 대결 - 세종대왕의 학사가 되다!</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>" />
    
    <!-- Google Fonts: Inter, Gowun Batang, Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              joseon: {
                bg: '#14110f',
                card: '#1e1a17',
                cardLight: '#faf6ee',
                paper: '#f5edd6',
                border: '#332a24',
                primary: '#c93b2b',
                primaryDark: '#8b261b',
                gold: '#f5b82e',
                goldLight: '#fde68a',
                dark: '#0f0d0c',
                blue: '#2b6cb0',
                green: '#2f855a',
                text: '#f3ece1',
                textMuted: '#a3988c'
              }
            },
            fontFamily: {
              sans: ['Inter', 'Noto Sans KR', 'Gowun Batang', 'sans-serif'],
              display: ['Gowun Batang', 'Inter', 'serif']
            },
            boxShadow: {
              'superlist': '0 20px 50px -10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(245, 184, 46, 0.1)',
              'card-glow': '0 10px 30px -5px rgba(201, 59, 43, 0.3)',
            }
          }
        }
      }
    </script>
    
    <style>
      body {
        background-color: #14110f;
        color: #f3ece1;
        font-family: 'Inter', 'Noto Sans KR', sans-serif;
      }
      .superlist-card {
        background: rgba(30, 26, 23, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.5rem;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .superlist-card:hover {
        border-color: rgba(245, 184, 46, 0.3);
        transform: translateY(-3px);
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 184, 46, 0.15);
      }
      .superlist-pill {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        border-radius: 9999px;
      }
      .btn-superlist-primary {
        background: linear-gradient(135deg, #e63946 0%, #c93b2b 100%);
        color: #ffffff;
        font-weight: 700;
        border-radius: 1rem;
        box-shadow: 0 8px 25px rgba(201, 59, 43, 0.4);
        transition: all 0.2s ease;
      }
      .btn-superlist-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(201, 59, 43, 0.6);
      }
      .btn-superlist-gold {
        background: linear-gradient(135deg, #fbbf24 0%, #f5b82e 100%);
        color: #1a1200;
        font-weight: 800;
        border-radius: 1rem;
        box-shadow: 0 8px 25px rgba(245, 184, 46, 0.35);
        transition: all 0.2s ease;
      }
      .btn-superlist-gold:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(245, 184, 46, 0.55);
      }
    </style>

    <!-- React 18, ReactDOM 18, Babel Standalone & Canvas Confetti -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  </head>
  <body class="antialiased selection:bg-amber-500 selection:text-black min-h-screen">
    <div id="root"></div>

    <!-- Main React Bundle Script -->
    <script type="text/babel" src="/app.jsx"></script>
  </body>
</html>
